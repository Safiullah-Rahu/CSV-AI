[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-intelligence"
version = "3.0.0"
description = "Knowledge Intelligence: enterprise RAG platform — backend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Safiullah Rahu" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=42",
    "pyotp>=2.9",
    "httpx>=0.27",
    "sqlglot>=25",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "tiktoken>=0.7",
    "filetype>=1.2",
    "langdetect>=1.0.9",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "striprtf>=0.0.26",
    "pyarrow>=16",
    "redis>=5.0",
]

[project.optional-dependencies]
# Database connectors beyond PostgreSQL/SQLite (installed in the Docker image).
connectors = ["pymysql>=1.1", "pymssql>=2.3", "oracledb>=2.2", "pymongo>=4.7"]
# Local embedding models (ONNX, CPU).
local-embeddings = ["fastembed>=0.3"]
# OCR for images and scanned PDFs (also needs the tesseract binary).
ocr = ["pytesseract>=0.3.10", "pillow>=10", "pypdfium2>=4.30"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pgserver>=0.1.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "UP007", "SIM105", "B905", "SIM101"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is not a package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
pythonpath = ["."]
markers = ["slow: long-running tests", "network: needs internet access"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
